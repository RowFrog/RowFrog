# Version updates for the backend's packages (backend/uv.lock, with pyproject.toml),
# the command-line tools in package.json (wrangler, Playwright, eslint) and the
# GitHub Actions in .github/workflows (owner, 20 Nov 2026).
# - Once a month: one PR per kind with all minor and patch updates; every major
#   update comes as its own PR, so a break can be traced to it.
# - Cooldown: a release must be 7 days old before it is proposed (a poisoned
#   release is usually found and pulled within days). Security fixes skip the
#   wait and come as soon as GitHub knows of them (Settings > Advanced Security:
#   Dependabot security updates and grouped security updates are on).
# .github/workflows/dependabot-merge.yml merges a backend PR by itself when CI
# is green, only the lock changed and no package moved to a new major. Majors,
# npm and Actions PRs wait for the owner's OK (owner rule, 20 Nov 2026).
# Python, Node, xcodegen and uv versions are not Dependabot's: the monthly
# dependency check (3rd of each month) compares .python-version and .nvmrc with
# the newest releases.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      backend:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      backend-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      tools:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      tools-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
