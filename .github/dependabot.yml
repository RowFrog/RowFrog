# Version updates for the backend's pinned packages (backend/requirements-publish.txt,
# and ruff in backend/requirements-dev.txt), the command-line tools in package.json
# (wrangler, Playwright) and the GitHub Actions in .github/workflows.
# Once a month one PR per kind raises them all; a security fix comes as its own PR as soon
# as GitHub knows of it (needs "Dependabot security updates" on in the repository's
# Settings > Advanced Security). .github/workflows/dependabot-merge.yml merges
# the pip ones when CI is green and only the pinned versions changed; npm and
# Actions PRs wait for a person, because wrangler and the Actions only show
# a problem when the deploys run on main.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      backend:
        applies-to: version-updates
        patterns: ["*"]
      backend-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      tools:
        applies-to: version-updates
        patterns: ["*"]
      tools-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
