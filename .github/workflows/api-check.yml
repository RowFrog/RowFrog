name: API check

# Shows how api.rowfrog.com answers: whether Cloudflare's proxy (orange cloud)
# is in front, which SSL mode works, and whether the usage counter answers.
# Runs by hand from the Actions tab or when this file changes.

on:
  push:
    paths:
      - .github/workflows/api-check.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Address
        run: dig +short api.rowfrog.com A; dig +short api.rowfrog.com CNAME
      - name: Forecast files
        run: |
          for path in v1/lakes/index v1/clubs/mrc-1880/forecast; do
            echo "== $path"
            curl -sS -o body -D - "https://api.rowfrog.com/$path" | grep -iE '^(HTTP|server|cf-ray|content-type|location)'
            head -c 120 body; echo
          done
      - name: Usage counter
        env:
          USAGE_KEY: ${{ secrets.USAGE_KEY }}
        run: |
          echo "== without key"; curl -sS -w '  (%{http_code})\n' https://api.rowfrog.com/usage || true
          echo "== with key"; curl -sS -w '  (%{http_code})\n' -H "Authorization: Bearer $USAGE_KEY" "https://api.rowfrog.com/usage?days=1" || true
      - name: Secrets present
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          C: ${{ secrets.USAGE_KEY }}
        run: |
          [ -n "$A" ] && echo "CLOUDFLARE_API_TOKEN set" || echo "CLOUDFLARE_API_TOKEN MISSING"
          [ -n "$B" ] && echo "CLOUDFLARE_ACCOUNT_ID set (${#B} characters)" || echo "CLOUDFLARE_ACCOUNT_ID MISSING"
          [ -n "$C" ] && echo "USAGE_KEY set (${#C} characters)" || echo "USAGE_KEY MISSING"
      - name: Token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('token', d.get('result',{}).get('status'), d.get('errors'))"
