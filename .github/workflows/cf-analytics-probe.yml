name: Cloudflare analytics probe (temporary)

# Checks whether the Cloudflare token can read Workers requests and D1 writes
# per day (GraphQL analytics), for a limit warning in the Usage limits check.

on:
  push:
    paths: [.github/workflows/cf-analytics-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime
          end = datetime.date.today(); start = end - datetime.timedelta(days=6)
          q = """query($a: String!, $s: Date!, $e: Date!) { viewer { accounts(filter: {accountTag: $a}) {
            workersInvocationsAdaptive(limit: 1000, filter: {date_geq: $s, date_leq: $e}) { sum { requests } dimensions { date scriptName } }
            d1AnalyticsAdaptiveGroups(limit: 1000, filter: {date_geq: $s, date_leq: $e}) { sum { rowsWritten rowsRead } dimensions { date } }
          } } }"""
          body = json.dumps({"query": q, "variables": {"a": os.environ["CLOUDFLARE_ACCOUNT_ID"], "s": str(start), "e": str(end)}}).encode()
          req = urllib.request.Request("https://api.cloudflare.com/client/v4/graphql", body, {"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"], "Content-Type": "application/json"})
          d = json.load(urllib.request.urlopen(req))
          print("errors:", d.get("errors"))
          acc = ((d.get("data") or {}).get("viewer") or {}).get("accounts") or []
          for a in acc:
              for r in sorted(a.get("workersInvocationsAdaptive") or [], key=lambda r: r["dimensions"]["date"]):
                  print("worker", r["dimensions"], r["sum"])
              for r in sorted(a.get("d1AnalyticsAdaptiveGroups") or [], key=lambda r: r["dimensions"]["date"]):
                  print("d1", r["dimensions"], r["sum"])
          PY
