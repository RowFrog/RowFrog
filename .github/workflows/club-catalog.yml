name: Club catalog

# Finds rowing clubs on lakes in southern Bavaria in OpenStreetMap and writes
# data/catalogs/de-osm.json (what the app's search offers) plus any missing lake
# outlines, committed back to the same branch. Runs by hand from the Actions
# tab or when the script changes.

on:
  # Only on main: a run commits the catalog back to its branch, and a bot
  # commit on a pull request branch holds that PR's checks for approval.
  push:
    branches: [main]
    paths:
      - scripts/discover_clubs.py
      - .github/workflows/club-catalog.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: ./.github/actions/backend-pins
      - run: pip install -c backend/requirements-publish.txt -e backend
      - name: Discover clubs
        run: |
          set -o pipefail
          python3 scripts/discover_clubs.py | tee catalog-report.txt
          { echo '```'; cat catalog-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the catalog loads
        run: python3 -c 'from rowfrog import locations; l = locations.load(); print(len(l.clubs), "clubs on", len(l.lakes), "lakes")'
      - name: Commit the catalog
        run: |
          git add data/catalogs/de-osm.json data/outlines
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update club catalog from OpenStreetMap"
            git pull --rebase
            git push
          fi
