name: DRV probe (temporary)

on:
  push:
    paths:
      - .github/workflows/drv-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look at a DRV club page
        run: |
          UA="RowerWeather/0.1 (+https://github.com/RowerWeatherFrog/RowerWeather)"
          for slug in ammersee-ruderer-ev bamberger-rudergesellschaft-von-1884-ev; do
            curl -sSL -A "$UA" -o club.html https://www.rudern.de/service/vereine/$slug
            echo "=== $slug"
            python3 -c "
          import re,html
          t=open('club.html',encoding='utf-8').read()
          m=re.search(r'(?s)<main.*?</main>',t); t=m.group(0) if m else t
          t=re.sub(r'(?s)<(script|style|nav).*?</\1>','',t)
          t=re.sub(r'<(br|/p|/div|/li|/h\d|/dt|/dd|/tr)[^>]*>','\n',t)
          t=html.unescape(re.sub(r'<[^>]+>',' ',t))
          print('\n'.join(l.strip() for l in t.splitlines() if l.strip())[:3000])
          print('GEO', re.findall(r'(?i)(lat[a-z]*[\"\':= ]+[0-9.]+|lng[\"\':= ]+[0-9.]+|lon[a-z]*[\"\':= ]+[0-9.]+)', open('club.html',encoding='utf-8').read())[:6])
          "
          done
          echo "=== list page markup around one club"
          curl -sSL -A "$UA" https://www.rudern.de/service/vereinssuche | grep -o -m1 -E '.{0,600}/service/vereine/ammersee-ruderer-ev.{0,900}'
