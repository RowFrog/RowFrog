name: DRV probe (temporary)

on:
  push:
    paths:
      - .github/workflows/drv-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look at the DRV club search
        run: |
          UA="RowerWeather/0.1 (+https://github.com/RowerWeatherFrog/RowerWeather)"
          curl -sSL -A "$UA" https://www.rudern.de/robots.txt | head -40
          echo "=== page"
          curl -sSL -A "$UA" -o page.html -w "%{http_code} %{size_download}\n" https://www.rudern.de/service/vereinssuche
          python3 - <<'PY'
          import json, re, html
          t = open("page.html", encoding="utf-8", errors="ignore").read()
          m = re.search(r'data-drupal-selector="drupal-settings-json">(.*?)</script>', t, re.S)
          settings = json.loads(m.group(1)) if m else {}
          def walk(o, path=""):
              if isinstance(o, dict):
                  for k, v in o.items(): yield from walk(v, f"{path}.{k}")
              elif isinstance(o, list) and o and isinstance(o[0], dict) and any("lat" in str(k).lower() for k in o[0]):
                  yield path, o
              elif isinstance(o, list):
                  for i, v in enumerate(o[:3]): yield from walk(v, f"{path}[{i}]")
          for path, items in walk(settings):
              print("POINTS", path, len(items), json.dumps(items[0], ensure_ascii=False)[:400])
          text = html.unescape(re.sub(r"<[^>]+>", "|", re.sub(r"(?s)<(script|style).*?</\1>", "", t)))
          text = re.sub(r"\s*\|[\s|]*", " | ", text)
          for e in re.findall(r"([^|]{3,90}) \| ([^|]{3,60}) \| (8[2-7]\d{3} [^|]{2,40})", text):
              print("BY", " / ".join(x.strip() for x in e))
          print("TOTAL clubs on page:", len(set(re.findall(r'/service/vereine/[a-z0-9-]+', t))))
          PY
          echo "=== impressum"
          curl -sSL -A "$UA" https://www.rudern.de/impressum | python3 -c "import re,html,sys;t=sys.stdin.read();t=re.sub(r'(?s)<(script|style).*?</\1>','',t);t=html.unescape(re.sub(r'<[^>]+>',' ',t));t=re.sub(r'\s+',' ',t);i=t.find('Impressum',3000);print(t[i:i+3000])"
