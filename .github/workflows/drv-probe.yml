name: DRV probe (temporary)

on:
  push:
    paths:
      - .github/workflows/drv-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look at the DRV club search
        run: |
          UA="RowerWeather/0.1 (+https://github.com/RowerWeatherFrog/RowerWeather)"
          curl -sSL -A "$UA" https://www.rudern.de/robots.txt | head -40
          echo "=== page"
          curl -sSL -A "$UA" -o page.html -w "%{http_code} %{size_download}\n" https://www.rudern.de/service/vereinssuche
          grep -oiE '(src|href|data-[a-z-]+|action)="[^"]*"' page.html | grep -iE 'verein|api|json|map|search|such|\.js' | sort -u | head -60
          grep -oiE '"[^"]*(api|json|ajax)[^"]*"' page.html | sort -u | head -40
          echo "=== text"
          python3 -c "import re,html;t=open('page.html',encoding='utf-8',errors='ignore').read();t=re.sub(r'(?s)<(script|style).*?</\1>','',t);t=html.unescape(re.sub(r'<[^>]+>',' ',t));print(re.sub(r'\s+',' ',t)[:4000])"
          echo "=== terms"
          grep -oiE 'href="[^"]*(impressum|nutzung|datenschutz|agb)[^"]*"' page.html | sort -u
