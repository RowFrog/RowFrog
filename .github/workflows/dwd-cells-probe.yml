name: DWD warn cell probe (temporary)

# Checks whether DWD's GeoServer has the municipality warn cells as their own
# layer, so the publish job can look each club's cell up once and then fetch all
# local warnings in one query per run.

on:
  push:
    paths: [.github/workflows/dwd-cells-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          W="https://maps.dwd.de/geoserver/dwd/ows"
          curl -fsS "$W?service=WFS&version=2.0.0&request=DescribeFeatureType&typeName=dwd:Warngebiete_Gemeinden" | grep -o 'name="[^"]*" [^/]*type="[^"]*"'
          for G in THE_GEOM SHAPE GEOM; do
            echo "== Starnberg cell via $G"
            curl -sS "$W?service=WFS&version=2.0.0&request=GetFeature&typeName=dwd:Warngebiete_Gemeinden&outputFormat=application/json&propertyName=WARNCELLID,NAME&CQL_FILTER=INTERSECTS($G,POINT(47.9988%2011.3439))" | head -c 400; echo
          done
          echo "== full warnings for two cells"
          curl -sS -w "\n%{http_code} %{size_download} bytes\n" "$W?service=WFS&version=2.0.0&request=GetFeature&typeName=dwd:Warnungen_Gemeinden&outputFormat=application/json&propertyName=WARNCELLID,EVENT,ONSET&CQL_FILTER=WARNCELLID%20IN%20(809276127,809188139)" | tail -c 600
