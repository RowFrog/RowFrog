name: DWD warn cell probe (temporary)

# Compares, for every club, the local DWD warnings read the old way (one query
# per club) with the new way (warn cell looked up once, then a few queries for
# all cells). Temporary, for the thread "Monitor server and data source usage".

on:
  push:
    paths: [.github/workflows/dwd-cells-probe.yml, backend/rowfrog/sources/dwd_warnings.py]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e backend
      - run: |
          python3 - <<'PY'
          import asyncio, time, httpx
          from rowfrog import locations
          from rowfrog.sources import dwd_warnings as d
          clubs = list(locations.load().clubs.values())
          async def main():
              gate = asyncio.Semaphore(8)
              async with httpx.AsyncClient() as c:
                  async def old(club):
                      async with gate:
                          for i in range(3):
                              try: return club.id, {w.identifier for w in await d.fetch_local_warnings(c, club.launch_point.lon, club.launch_point.lat)}
                              except httpx.HTTPError: await asyncio.sleep(2)
                          return club.id, None
                  async def cell(club):
                      async with gate:
                          for i in range(3):
                              try: return club.id, await d.fetch_warn_cell(c, club.launch_point.lon, club.launch_point.lat)
                              except httpx.HTTPError: await asyncio.sleep(2)
                          return club.id, "failed"
                  t = time.time(); before = dict(await asyncio.gather(*map(old, clubs))); t_old = time.time() - t
                  t = time.time(); cells = dict(await asyncio.gather(*map(cell, clubs))); t_cells = time.time() - t
                  t = time.time(); bulk = await d.fetch_local_warnings_for_cells(c, {x for x in cells.values() if isinstance(x, int)}); t_bulk = time.time() - t
                  t = time.time(); after_old = dict(await asyncio.gather(*map(old, clubs[:0])))
              same = differ = failed = 0
              for club in clubs:
                  b, x = before[club.id], cells[club.id]
                  if b is None or x == "failed": failed += 1; continue
                  a = set() if x is None else {w.identifier for w in bulk.get(x, [])}
                  if a == b: same += 1
                  else:
                      differ += 1
                      if differ <= 15: print("DIFFER", club.id, club.country if hasattr(club, "country") else "", x, sorted(b - a)[:2], sorted(a - b)[:2])
              print(f"{len(clubs)} clubs: same {same}, differ {differ}, failed {failed}")
              print(f"no warn cell: {sum(1 for v in cells.values() if v is None)}; distinct cells {len(set(cells.values()))}")
              print(f"old way {t_old:.0f}s ({len(clubs)} queries), cell lookups {t_cells:.0f}s, bulk {t_bulk:.1f}s ({-(-len(bulk)//d.CELLS_PER_QUERY)} queries)")
              print("warnings now:", sum(1 for v in before.values() if v))
          asyncio.run(main())
          PY
