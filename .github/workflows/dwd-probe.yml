name: DWD probe

on:
  push:
    paths:
      - .github/workflows/dwd-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe DWD warning endpoints
        run: |
          G="https://maps.dwd.de/geoserver/dwd/ows"
          echo "=== layers"
          curl -sS "$G?service=WFS&version=2.0.0&request=GetCapabilities" | grep -oE '<Name>dwd:[^<]+</Name>' | sort -u | grep -iE 'warn|see|kuest|binnen|gewaess' || true
          for layer in Warnungen_Binnenseen Warnungen_Gemeinden; do
            echo "=== $layer describe"
            curl -sS "$G?service=WFS&version=2.0.0&request=DescribeFeatureType&typeName=dwd:$layer" | grep -oE 'name="[^"]+"' | tr '\n' ' '; echo
          done
          echo "=== Binnenseen features (no geometry)"
          curl -sS "$G?service=WFS&version=2.0.0&request=GetFeature&typeName=dwd:Warnungen_Binnenseen&outputFormat=application/json" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("totalFeatures"), "features"); [print(json.dumps(f["properties"], ensure_ascii=False)[:1500], (f.get("geometry") or {}).get("type")) for f in d["features"][:15]]'
          echo "=== Gemeinden at Starnberg"
          curl -sS -G "$G" --data-urlencode service=WFS --data-urlencode version=2.0.0 --data-urlencode request=GetFeature \
            --data-urlencode typeName=dwd:Warnungen_Gemeinden --data-urlencode outputFormat=application/json \
            --data-urlencode "CQL_FILTER=CONTAINS(THE_GEOM,POINT(47.9967 11.3474))" | head -c 3000; echo
          echo "=== Gemeinden any (count + sample)"
          curl -sS "$G?service=WFS&version=2.0.0&request=GetFeature&typeName=dwd:Warnungen_Gemeinden&outputFormat=application/json&count=2&propertyName=NAME,EVENT,SEVERITY,EC_II,ONSET,EXPIRES,HEADLINE" | head -c 2500; echo
          for l in $(curl -sS "$G?service=WFS&version=2.0.0&request=GetCapabilities" | grep -oE '<Name>dwd:[^<]+</Name>' | sed -E 's/<\/?Name>//g' | grep -iE 'binnen|seen'); do
            echo "=== $l sample"
            curl -sS "$G?service=WFS&version=2.0.0&request=GetFeature&typeName=$l&outputFormat=application/json&count=40" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("totalFeatures")); [print(json.dumps(f["properties"], ensure_ascii=False)[:300]) for f in d["features"][:40]]' || true
          done
          echo "=== opendata cap"
          curl -sS https://opendata.dwd.de/weather/alerts/cap/ | grep -oE 'href="[^"]+"'
          echo "=== warnapp json"
          for u in https://www.dwd.de/DWD/warnungen/warnapp/json/warnings.json https://www.dwd.de/DWD/warnungen/warnapp_gemeinden/json/warnings_gemeinde.json; do
            curl -sS -o /tmp/x -w "$u %{http_code} %{size_download}\n" "$u"; head -c 300 /tmp/x; echo
          done
