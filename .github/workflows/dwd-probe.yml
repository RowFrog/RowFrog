name: DWD probe

on:
  push:
    paths:
      - .github/workflows/dwd-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe DWD warning endpoints
        shell: python3 {0}
        run: |
          import json, urllib.request, urllib.parse
          G = "https://maps.dwd.de/geoserver/dwd/ows"
          def get(**p):
              q = dict(service="WFS", version="2.0.0", request="GetFeature", outputFormat="application/json"); q.update(p)
              with urllib.request.urlopen(G + "?" + urllib.parse.urlencode(q), timeout=60) as r:
                  return json.load(r)
          for crs in ["EPSG:4326", "urn:ogc:def:crs:EPSG::4326"]:
              d = get(typeName="dwd:Warngebiete_Binnenseen", srsName=crs, count=1)
              f = d["features"][0]; g = f["geometry"]
              c = g["coordinates"]
              while isinstance(c[0], list): c = c[0]
              print("binnen", crs, f["properties"]["NAME"], g["type"], c, f.get("bbox"))
          for name, pt in [("starnberg", (47.9967, 11.3474)), ("kronshagen", (54.337, 10.08))]:
              for order in ["latlon", "lonlat"]:
                  a, b = pt if order == "latlon" else pt[::-1]
                  for layer in ["Warngebiete_Gemeinden", "Warnungen_Gemeinden"]:
                      try:
                          d = get(typeName="dwd:" + layer, CQL_FILTER=f"INTERSECTS(THE_GEOM,POINT({a} {b}))", propertyName="NAME,WARNCELLID,EVENT", count=5)
                          print(name, order, layer, d.get("totalFeatures"), [f["properties"] for f in d["features"]])
                      except Exception as e:
                          print(name, order, layer, "ERR", e)
          d = get(typeName="dwd:Warnungen_Gemeinden", count=1)
          print(json.dumps(d["features"][0]["properties"], ensure_ascii=False, indent=1))
          d = get(typeName="dwd:Warnungen_Gemeinden", propertyName="EVENT,EC_II,EC_GROUP,SEVERITY")
          print(sorted({(f["properties"]["EVENT"], f["properties"]["EC_II"], f["properties"]["EC_GROUP"], f["properties"]["SEVERITY"]) for f in d["features"]}))
          d = get(typeName="dwd:Warngebiete_Binnenseen", propertyName="NAME,WARNCELLID,SUCHE,ZUSATZ,BL")
          for f in d["features"]: print(f["properties"])
