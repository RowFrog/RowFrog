name: DWD probe (temporary)

# Checks which English warning texts DWD publishes. Remove when done.

on:
  push:
    paths:
      - .github/workflows/dwd-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Warning layers on the GeoServer
        run: |
          curl -sS -m 60 "https://maps.dwd.de/geoserver/dwd/ows?service=WFS&version=2.0.0&request=GetCapabilities" \
            | grep -o "<Name>dwd:[A-Za-z_]*Warn[A-Za-z_]*</Name>" | sort -u
      - name: Attributes of the municipality and lake warnings
        run: |
          for t in Warnungen_Gemeinden Warnungen_Binnenseen; do
            echo "== $t"
            curl -sS -m 60 "https://maps.dwd.de/geoserver/dwd/ows?service=WFS&version=2.0.0&request=DescribeFeatureType&typeName=dwd:$t" \
              | grep -o 'name="[A-Z_a-z]*"' | tr '\n' ' '
            echo
          done
      - name: One municipality warning with all text fields
        run: |
          curl -sS -m 60 "https://maps.dwd.de/geoserver/dwd/ows?service=WFS&version=2.0.0&request=GetFeature&typeName=dwd:Warnungen_Gemeinden&count=3&outputFormat=application/json&propertyName=AREADESC,EVENT,EC_II,EC_GROUP,HEADLINE,DESCRIPTION,INSTRUCTION,LANGUAGE,PARAMETERNAME,PARAMETERVALUE,SEVERITY" \
            | python3 -c "import json,sys; [print(json.dumps(f['properties'], ensure_ascii=False)) for f in json.load(sys.stdin)['features']]" || true
      - name: English CAP files on opendata
        run: |
          for d in COMMUNEUNION_DWD_STAT COMMUNEUNION_CELLS_STAT DISTRICT_DWD_STAT; do
            echo "== $d"
            curl -sS -m 60 "https://opendata.dwd.de/weather/alerts/cap/$d/" | grep -o 'href="[^"]*"' | head -20
          done
      - name: An English CAP alert
        run: |
          f=$(curl -sS -m 60 "https://opendata.dwd.de/weather/alerts/cap/COMMUNEUNION_DWD_STAT/" | grep -o 'href="[^"]*EN[^"]*\.zip"' | tail -1 | cut -d'"' -f2)
          echo "file: $f"
          [ -n "$f" ] || exit 0
          curl -sS -m 120 -o en.zip "https://opendata.dwd.de/weather/alerts/cap/COMMUNEUNION_DWD_STAT/$f"
          ls -la en.zip; unzip -o -q en.zip -d en; ls en | head; ls en | wc -l
          x=$(ls en | head -1); sed -n 1,80p "en/$x"
