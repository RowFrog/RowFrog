name: DWD probe

on:
  push:
    paths:
      - .github/workflows/dwd-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e backend
      - shell: python3 {0}
        run: |
          import asyncio, time, traceback, httpx
          from rowerweather.sources import dwd_warnings as d
          async def main():
              async with httpx.AsyncClient() as c:
                  for name, coro in [("areas", lambda: d.fetch_lake_areas(c)), ("lake", lambda: d.fetch_lake_warnings(c)), ("local", lambda: d.fetch_local_warnings(c, 11.3474, 47.9967)), ("local-kiel", lambda: d.fetch_local_warnings(c, 10.08, 54.337))]:
                      t = time.time()
                      try:
                          r = await coro()
                          print(name, "ok", round(time.time() - t, 1), "s", len(r), [getattr(x, "name", x) for x in r][:3])
                      except Exception as e:
                          print(name, "FAILED", round(time.time() - t, 1), "s", repr(e))
                          if isinstance(e, httpx.HTTPStatusError): print(e.response.text[:1500])
                          traceback.print_exc()
          asyncio.run(main())
