name: DWD warnings probe

# Research only: asks DWD's GeoServer the forecast run's warning questions a
# few times (scripts/probes/dwd_warnings_probe.py). Nothing is stored.

on:
  push:
    paths:
      - scripts/probes/dwd_warnings_probe.py
      - .github/workflows/dwd-warnings-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -c backend/requirements-publish.txt httpx
      - run: python3 scripts/probes/dwd_warnings_probe.py
