name: Freeze bisect (temporary, never merged)

on:
  push:
    branches: [claude/project-thread-xu6j39]
    paths: [".github/workflows/freeze-bisect.yml"]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        ref: ["1b667e6"]
        cut: ["none", "satfix", "satfix-b"]
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the version under test, with the stress hook
        run: |
          cp .github/probe/StressProbe.swift /tmp/StressProbe.swift
          cp .github/probe/satfix.patch /tmp/satfix.patch
          git checkout -q "${{ matrix.ref }}"
          git log --oneline -1
          cp /tmp/StressProbe.swift ios/RowFrog/StressProbe.swift
          python3 - <<'PY'
          import re
          p = "ios/RowFrog/RootView.swift"
          s = open(p).read()
          hook = '''            applyLaunchArguments()
                      if UserDefaults.standard.bool(forKey: "RWStress") {
                          Task { await StressProbe.run(ids: locations.saved.map(\\.id)) { selection = $0 } }
                      }
          '''
          s = s.replace("            applyLaunchArguments()\n", hook.replace("\n          ", "\n"), 1)
          assert "RWStress" in s
          open(p, "w").write(s)
          PY
          grep -n "RWStress" -A2 ios/RowFrog/RootView.swift
          CUT="${{ matrix.cut }}" python3 - <<'PY'
          import os
          cut = os.environ["CUT"]
          def edit(path, old, new):
              s = open(path).read()
              assert old in s, (path, old)
              open(path, "w").write(s.replace(old, new))
          page = "ios/RowFrog/LocationPageView.swift"
          root = "ios/RowFrog/RootView.swift"
          if cut.startswith("satfix"):
              import subprocess
              subprocess.run(["git", "apply", "/tmp/satfix.patch"], check=True)
          if cut in ("all", "bar-inset"):
              cut_list = ["layout-fade", "fonts", "glass"]
          else:
              cut_list = [] if cut in ("none", "satfix", "satfix-b") else [c.replace("fade", "layout-fade") for c in cut.split("+")]
          if cut in ("bar-inset", "bar-only"):
              edit(root, "        .overlay(alignment: .bottom) {\n            let forecast", "        .safeAreaInset(edge: .bottom, spacing: 0) {\n            let forecast")
          if cut == "dyn":
              edit(root, ".dynamicTypeSize(...DynamicTypeSize.large)", "")
              edit(root, ".accessibilityShowsLargeContentViewer()", "")
          for cut in cut_list:
            if cut in ("padding", "layout", "layout-fade"):
                edit(page, ".safeAreaPadding(.top, max(0, pageMargins.top - geometry.safeAreaInsets.top))", "")
                edit(page, ".safeAreaPadding(.bottom, max(0, pageMargins.bottom - geometry.safeAreaInsets.bottom))", "")
            if cut in ("layout", "layout-fade"):
                edit(root, ".ignoresSafeArea(edges: [.top, .bottom])", "")
            if cut == "layout-fade":
                edit(root, "TopEdgeFade(statusBar: insets.top)", "Color.clear.frame(height: 0)")
            if cut == "fonts":
                edit("ios/RowFrog/ScaledFont.swift", "content.font(.system(size: min(scaled, size * maxGrowth), weight: weight))", "content.font(.system(size: size, weight: weight))")
            if cut == "glass":
                edit("ios/RowFrog/Backgrounds.swift", "            glass(in: shape)\n", "            background(shape.fill(.regularMaterial))\n")
          print("cut", cut)
          PY
          git diff --stat
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e backend
      - name: Start the backend
        run: |
          (cd backend && nohup uvicorn rowfrog.api:app --port 8000 > ../uvicorn.log 2>&1 &)
          curl -sS --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8000/lakes > /dev/null
          for club in mrc-1880 mrsv-bayern tutzinger-rv; do
            curl -sS -m 200 --retry 3 --retry-all-errors --retry-delay 5 -o /dev/null "http://localhost:8000/clubs/$club/forecast" || true
          done
      - name: Build
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          found = [d for r, ds in json.load(sys.stdin)["devices"].items() if "iOS" in r for d in ds if d["name"].startswith("iPhone")]
          best = [d for d in found if d["name"].endswith(" Pro")]
          print((best or found)[-1]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcodebuild build -project RowFrog.xcodeproj -scheme RowFrog -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -3
      - name: Swipe and turn, three times
        run: |
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/build/Build/Products/Debug-iphonesimulator/RowFrog.app
          DATA=$(xcrun simctl get_app_container "$UDID" com.rowfrog.RowFrog data)
          for n in 1 2 3 4 5; do
            perl -e 'alarm 60; exec @ARGV' xcrun simctl terminate "$UDID" com.rowfrog.RowFrog || true
            sleep 2
            SIMCTL_CHILD_TZ=Europe/Berlin xcrun simctl launch "$UDID" com.rowfrog.RowFrog -RWSafetyAccepted YES -RWWhatsNewSeen 1000 \
              -RWDemoClubs YES -RWTutorialSeen YES -RWNoTips YES -RWAllowsLandscape YES -RWStress YES > /dev/null
            sampled=""
            for i in $(seq 1 18); do
              sleep 5
              if [ -z "$sampled" ] && [ ! -f /tmp/sample.txt ] && grep -q "STALL still" "$DATA/Documents/stress.log" 2>/dev/null; then
                PID=$(pgrep -f 'RowFrog.app/RowFrog' | head -1)
                sample "$PID" 3 -file /tmp/sample.txt > /dev/null 2>&1 || echo "sample failed"
                sampled=1
              fi
            done
            echo "RESULT cut=${{ matrix.cut }} try $n: hangs over 10 s: $(grep -c 'STALL still' "$DATA/Documents/stress.log" || true), finished: $(grep -c done "$DATA/Documents/stress.log" || true), turns: $(grep -c turn "$DATA/Documents/stress.log" || true)"
          done
          echo "=== RowFrog frames during the first hang ==="
          [ -f /tmp/sample.txt ] && grep -o '[^!+|:]*(in RowFrog.debug.dylib)[^[]*' /tmp/sample.txt | sed 's/^ *[0-9]* //' | sort | uniq -c | sort -rn | head -40 || echo "no hang sampled"
