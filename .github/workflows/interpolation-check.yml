name: Interpolation check

# How well the lake view's blending between forecast points (natural
# neighbour, owner's pick 6 Nov 2026) matches the latest ICON-D2 run, next to
# nearest point, inverse distance and triangles: bias, errors, values outside
# the points' range and squares with the wrong light, as tables in the run's
# summary (scripts/interpolation_check.py). Run by hand; the thread "Run
# recurring background tasks" starts it every Monday. Nothing is stored.

on:
  workflow_dispatch:
    inputs:
      lakes:
        description: Lake ids, space-separated (empty = the script's 15 lakes)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -c backend/requirements-publish.txt -e backend eccodes
      - name: Made-up fields
        run: python3 scripts/interpolation_check.py sample ${{ inputs.lakes }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Latest ICON-D2 run
        run: python3 scripts/interpolation_check.py icon-d2 ${{ inputs.lakes }} | tee -a "$GITHUB_STEP_SUMMARY"
