name: Probe section waters (research, not to merge)
on:
  push:
    branches: [claude/project-thread-oxkjtl]
    paths: [.github/workflows/probe-section-waters.yml, scripts/probe_section_waters.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - run: pip install shapely osmium && pip install -e backend
      - id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            osm/lines.osm.pbf
            osm/water.geojsonseq
          key: river-sections-osm-${{ steps.day.outputs.day }}
          restore-keys: river-sections-osm-
      - if: steps.cache.outputs.cache-matched-key == ''
        run: |
          mkdir -p osm && cd osm
          for area in europe/germany europe/austria europe/switzerland; do
            name=$(basename $area)
            curl -sSfL -o $name.pbf https://download.geofabrik.de/$area-latest.osm.pbf
            osmium tags-filter $name.pbf nwr/natural=water nwr/landuse=reservoir,harbour wr/waterway=riverbank -o water-$name.pbf
            osmium export water-$name.pbf -f geojsonseq --geometry-types=polygon -o water-$name.geojsonseq
            rm $name.pbf water-$name.pbf
          done
          cat water-*.geojsonseq > water.geojsonseq
      - run: |
          python3 -u scripts/probe_section_waters.py osm/water.geojsonseq oesterr-sportunion-wallsee-sektion-rudern,ludwigshafener-ruderverein-von-1878-rheingoenheim,volkstuemlicher-wassersport-mannheim,ruder-club-salzburg,osnabruecker-ruder-verein,ruderclub-ratsgymnasium-ev-osnabrueck,rr-gymnasium-carolinum-osnabrueck,ruder-club-witten,rudergesellschaft-niederkassel-von-1978,wasser-sport-verein-duesseldorf-rudergesellschaft-von-1893,wassersportverein-koenigs-wusterhausen,korneuburger-ruderverein-alemannia,wiener-ruderverein-austria | tee report.txt
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
