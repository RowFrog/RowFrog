name: Publish forecasts

# The app's backend while it has no server of its own: runs the backend code
# on a schedule and publishes its answers as static files on GitHub Pages, at
# https://api.rowfrog.com/v1/ (see scripts/publish_static.py).
# The confirmed and used clubs are rebuilt every 30 minutes (started by the
# Cloudflare timer in cloudflare/timer/, GitHub's timer as backup). Every 6
# hours, on the full hour at 04, 10, 16 and 22 UTC, that run is the one for all
# catalog clubs instead, which covers the used clubs too; weather is loaded only after a new model run (see the script),
# and the last forecasts are kept between runs in the Actions cache.
# The files live on the gh-pages branch, kept as a single commit so
# its history does not grow. Pages must be set to "Deploy from a branch",
# gh-pages, / (root) in the repository settings.
# Secrets: CDSE_CLIENT_ID / CDSE_CLIENT_SECRET (satellite pictures and ice),
# USAGE_KEY (the usage counter, when it is set up).

on:
  # A change to the publisher publishes at once, but only from main: other
  # branches would overwrite the live files with their own, older code.
  # (Run it by hand to try a branch.)
  push:
    branches: [main]
    paths:
      - scripts/publish_static.py
      - .github/workflows/publish-backend.yml
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      clubs:
        description: "Which clubs to refresh"
        type: choice
        options: [confirmed, all]
        default: all

permissions:
  contents: write

# GitHub keeps one waiting run per group and cancels an older waiting one.
# The backup timer has a group of its own, so it can never cancel a waiting
# run of the Cloudflare timer (on 6 Nov 2026 it dropped the 14:30 update).
# Its runs only publish while the files are over 40 minutes old, i.e. while
# the Cloudflare timer is not running, so the two never write at once.
concurrency:
  group: publish-forecasts-${{ github.event_name == 'schedule' && 'backup' || 'timer' }}
  cancel-in-progress: false

jobs:
  # The half-hourly runs are started on time by the Cloudflare timer
  # (cloudflare/timer/). GitHub's own "*/30" timer is the backup: it often
  # fires late or not at all, and while the published files are younger than
  # 40 minutes (the timer is working) its run stops here.
  due:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.age.outputs.run }}
    steps:
      - id: age
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.schedule }}" != "*/30 * * * *" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          published=$(gh api "repos/${{ github.repository }}/commits/gh-pages" --jq .commit.committer.date || echo "")
          if [ -z "$published" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          age=$(( $(date -u +%s) - $(date -u -d "$published" +%s) ))
          echo "Last published $published, $((age / 60)) minutes ago"
          if [ "$age" -lt 2400 ]; then
            echo "The Cloudflare timer is keeping the files fresh; this backup run stops here."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A run of all clubs takes 15 to 22 minutes (6 Nov 2026, with the lake
    # weather near each launch point). On 1 Nov 2026 one hung for
    # 45 minutes and, by the concurrency group, held every later run back;
    # without a limit it would have held them for GitHub's 6 hours.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/uv.lock
      # The pinned versions only (backend/requirements-publish.txt), so a new
      # release can't stop the forecasts before the tests have seen it.
      - uses: ./.github/actions/backend-pins
      - run: pip install -c backend/requirements-publish.txt -e "backend[satellite]"
      - name: Get the published files
        # A separate worktree, so only the published files are committed, never the repository.
        run: |
          if git fetch --depth 1 origin gh-pages; then
            git worktree add --detach site origin/gh-pages
          else
            git worktree add --orphan -b gh-pages-new site
          fi
      - name: Get the last forecasts
        uses: actions/cache/restore@v6
        with:
          path: state
          key: publish-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: publish-state-
      - name: Run the backend and write the files
        # A hung backend stops here, before the job's limit; the live files stay as they are.
        timeout-minutes: 30
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          RW_USAGE_KEY: ${{ secrets.USAGE_KEY }}
        run: |
          CLUBS="${{ inputs.clubs }}"
          if [ -z "$CLUBS" ]; then
            # Backup timer: the same plan as the Cloudflare timer (ALL_HOURS in
            # cloudflare/timer/src/index.js), all clubs in the first half of
            # 04, 10, 16 and 22 UTC.
            ALL_HOURS=" 04 10 16 22 "
            # A push of the publisher rebuilds all clubs, as before.
            if [ "${{ github.event_name }}" != schedule ]; then
              CLUBS=all
            elif [[ "$ALL_HOURS" == *" $(date -u +%H) "* ]] && [ "$(date -u +%M)" -lt 30 ]; then
              CLUBS=all
            else
              CLUBS=confirmed
            fi
          fi
          python3 scripts/publish_static.py site/v1 --clubs "$CLUBS" --state state/publish.pickle
          touch site/.nojekyll
      - name: Keep the forecasts for the next run
        if: always() && hashFiles('state/publish.pickle') != ''
        uses: actions/cache/save@v6
        with:
          path: state
          key: publish-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish to gh-pages as a single commit
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan publish
          git add -A
          # Never publish anything but the forecast files (and CNAME, which GitHub writes for a custom domain).
          if git diff --cached --name-only | grep -qv -e '^v1/' -e '^\.nojekyll$' -e '^CNAME$'; then
            echo "Unexpected files in the site:"; git diff --cached --name-only | grep -v -e '^v1/' -e '^\.nojekyll$' -e '^CNAME$' | head
            exit 1
          fi
          git commit -q -m "Forecasts $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin publish:gh-pages
      - name: Check the published address
        # GitHub Pages takes a minute or two to serve a new commit.
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null https://api.rowfrog.com/v1/lakes/index; then echo "api.rowfrog.com answers"; exit 0; fi
            sleep 30
          done
          echo "::warning::https://api.rowfrog.com/v1/lakes/index does not answer"
