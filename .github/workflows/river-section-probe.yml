name: River section check

# Research only: works out a rowing section of the river (up to the next weir,
# lock or 10 km either way) around a few river clubs from OpenStreetMap
# (scripts/river_section_probe.py). Runs when the script changes, or by hand
# from the Actions tab. Nothing is stored.

on:
  push:
    paths:
      - scripts/river_section_probe.py
      - .github/workflows/river-section-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely
      - run: python3 scripts/river_section_probe.py
