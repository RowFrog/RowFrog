name: River section survey

# Research only: for every river club, how far the next weir or lock is up-
# and downstream (scripts/river_section_survey.py), and how OpenStreetMap
# tags every club water, e.g. reservoirs (scripts/water_kind_probe.py).
# Works on the Geofabrik extracts of Germany, Austria and Switzerland
# (scripts/osm_extract.py), filtered with osmium, so the busy public Overpass
# servers are not needed. Runs when these scripts change, or by hand from the
# Actions tab. Nothing is stored in the repo.

on:
  push:
    paths:
      - scripts/river_section_survey.py
      - scripts/river_section_summary.py
      - scripts/water_kind_probe.py
      - scripts/osm_extract.py
      - .github/workflows/river-section-survey.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - run: pip install shapely osmium
      - name: Download and filter the extracts
        run: |
          mkdir -p osm && cd osm
          for area in europe/germany europe/austria europe/switzerland; do
            name=$(basename $area)
            curl -sSfL -o $name.pbf https://download.geofabrik.de/$area-latest.osm.pbf
            osmium tags-filter $name.pbf w/waterway=river,canal,weir,dam,lock_gate w/lock=yes n/waterway=weir,dam,lock_gate,waterfall,milestone -o lines-$name.pbf
            osmium tags-filter $name.pbf nwr/natural=water nwr/landuse=reservoir wr/waterway=riverbank -o water-$name.pbf
            osmium export water-$name.pbf -f geojsonseq --geometry-types=polygon -o water-$name.geojsonseq
            rm $name.pbf water-$name.pbf
          done
          osmium merge lines-*.pbf -o lines.osm.pbf
          cat water-*.geojsonseq > water.geojsonseq
          ls -la
      - run: python3 scripts/water_kind_probe.py --extract osm/water.geojsonseq
      - run: python3 scripts/river_section_survey.py --extract osm/lines.osm.pbf osm/water.geojsonseq survey.json
      - run: python3 scripts/river_section_summary.py survey.json
