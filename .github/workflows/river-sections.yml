name: River sections

# By hand only: builds the river sections of the river and canal clubs
# (scripts/build_river_sections.py) from the Geofabrik extracts of Germany,
# Austria and Switzerland, filtered with osmium, and commits
# data/river-sections.json and the section outlines (data/outlines) to the
# branch it runs on. Run it on main; on a pull request branch the bot commit
# holds the checks until the next push. "only" rebuilds just the sections of
# the given club ids (comma-separated) and keeps the rest; "verbose" prints
# each side's walk. The filtered extracts are cached for the day, so a second
# run on the same day skips the 20-minute download.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Club ids whose sections to rebuild (comma-separated; empty = all)"
        required: false
        default: ""
      verbose:
        description: "Print each side's walk (weirs, mouths, line ends)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: river-sections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - run: pip install shapely osmium && pip install -e backend
      - name: Today's date
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cached extracts
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            osm/lines.osm.pbf
            osm/water.geojsonseq
          key: river-sections-osm-${{ steps.day.outputs.day }}
      - name: Download and filter the extracts
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p osm && cd osm
          for area in europe/germany europe/austria europe/switzerland; do
            name=$(basename $area)
            curl -sSfL -o $name.pbf https://download.geofabrik.de/$area-latest.osm.pbf
            osmium tags-filter $name.pbf w/waterway=river,canal,weir,dam,lock_gate w/lock=yes n/waterway=weir,dam,lock_gate,waterfall,milestone -o lines-$name.pbf
            osmium tags-filter $name.pbf nwr/natural=water nwr/landuse=reservoir,harbour wr/waterway=riverbank -o water-$name.pbf
            osmium export water-$name.pbf -f geojsonseq --geometry-types=polygon -o water-$name.geojsonseq
            rm $name.pbf water-$name.pbf
          done
          osmium merge lines-*.pbf -o lines.osm.pbf
          cat water-*.geojsonseq > water.geojsonseq
          ls -la
      - name: Build the sections
        env:
          ONLY: ${{ inputs.only }}
          VERBOSE: ${{ inputs.verbose && '--verbose' || '' }}
        run: |
          set -o pipefail
          python3 -u scripts/build_river_sections.py osm/lines.osm.pbf osm/water.geojsonseq --only "$ONLY" $VERBOSE | tee report.txt
          { echo '### River sections'; echo '```'; grep -v '^extract:' report.txt | tail -n 400; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the clubs load on their sections
        run: |
          python3 -c '
          from rowfrog import locations
          l = locations.load()
          print(sum(1 for x in l.lakes.values() if x.section), "sections loaded")'
      - name: Commit the sections
        run: |
          git add data/river-sections.json data/outlines
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "River sections rebuilt from OpenStreetMap"
            git pull --rebase
            git push
          fi
