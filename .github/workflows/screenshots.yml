      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          retention-days: 14
          path: |
            docs/screenshots
            uvicorn.log
      - name: Save the screenshots on the branch screenshots/<branch>
        if: always()
        run: |
          # One commit with only the pictures and no parent, replacing the last one.
          [ -d docs/screenshots ] || exit 0
          export GIT_INDEX_FILE="$RUNNER_TEMP/screenshots.index"
          git --work-tree=docs/screenshots add -A -f .
          tree=$(git write-tree)
          commit=$(git -c user.name=RowFrog -c user.email=344322998+RowFrog@users.noreply.github.com \
            commit-tree "$tree" -m "Screenshots of $GITHUB_REF_NAME at ${GITHUB_SHA::7}")
          git push -f origin "$commit:refs/heads/screenshots/$GITHUB_REF_NAME"
          # The sets of branches that are gone (merged and deleted) go too.
          branches=$(git ls-remote --heads origin | sed 's|.*refs/heads/||')
          printf '%s\n' "$branches" | sed -n 's|^screenshots/||p' | while read -r name; do
            if ! printf '%s\n' "$branches" | grep -qxF "$name"; then git push -q origin ":refs/heads/screenshots/$name" || true; fi
          done
