name: App screenshots

# Runs the backend on the runner with live data, starts the app in the iOS
# Simulator and attaches the screenshots to the run as the "screenshots"
# download (kept as long as the repository keeps downloads, 14 days since
# 15 Nov 2026). Nothing goes into git: no branch history and, since 15 Nov 2026,
# no refs/screenshots/<branch> either (owner, 25 Oct and 15 Nov 2026: old
# screenshots made the repository large). Each run starts from the newest
# "screenshots" download of the same branch, else main's, so a run with `only`
# keeps the other screens; with none left it starts empty.
# Get them: gh run download <run id> -n screenshots -D <folder>
# The shots of each run are also pushed as one commit with no history to the
# branch screenshots/<branch>, replaced on every run and deleted once <branch>
# is gone, so cloud threads that cannot reach the download can read them with
# git (owner, 15 Nov 2026): git fetch --depth 1 origin refs/heads/screenshots/<branch>
# && git archive FETCH_HEAD | tar -x -C <folder>. No workflow runs on those branches.
# Long pages are shot screen by screen (-p1, -p2, ...) down to the bottom.
# Tutzinger RV gets a made-up lake storm warning, marked SAMPLE in the app,
# so both warning states show; every other warning is live.
# Seeclub Zürich and RV Albatros Klagenfurt get a made-up thunderstorm warning
# from MeteoSwiss and GeoSphere Austria, also marked SAMPLE.
# The Simssee gets a made-up Landsat reading (RW_SAMPLE_SATELLITE_WATER).
# The lake view gets a made-up south wind (RW_SAMPLE_LAKE_WIND), marked
# "Sample wind", so its screens show waves building along the lake.
# Runs only by hand from the Actions tab (owner rule, 24 Oct 2026): once per PR
# when it is ready for review, for the screens that changed (input `only`), and
# a full set only when the owner asks. It holds a Mac runner for a long time.

on:
  workflow_dispatch:
    inputs:
      only:
        description: Only shoot screens whose name matches this regular expression, e.g. lake-view (empty = all)
        required: false
        default: ""
      runner:
        description: Mac runner image (empty = the one with the newest released Xcode, as in CI; macos-26-intel for Xcode 26)
        required: false
        default: ""
      xcode:
        description: Xcode to build with, e.g. 27.2 (empty = the image's default)
        required: false
        default: ""
      device:
        description: Simulator to shoot on; iPad and the small iPhones (13 mini, SE) go to their own folder inside the same set
        required: false
        type: choice
        options: [iPhone, iPad, iPhone 13 mini, iPhone SE]
        default: iPhone

permissions:
  # Writes the branch screenshots/<branch> (pictures only, no history).
  contents: write
  # Reads earlier runs' "screenshots" downloads to start from.
  actions: read

jobs:
  newest-xcode:
    # The runner with the newest released Xcode, as in CI (scripts/newest_xcode_runner.py).
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - id: pick
        run: python3 scripts/newest_xcode_runner.py | tee -a "$GITHUB_OUTPUT"

  open-meteo-tape:
    # GitHub's Mac runners could not connect to Open-Meteo from 16 Nov 2026
    # (connect timeouts, see PR #501). This Linux job asks the backend for the
    # screens' clubs and lakes and records every Open-Meteo answer; the Mac job
    # plays them back, and asks live only what is not on the tape.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: ./.github/actions/backend-pins
      - run: pip install -c backend/requirements-publish.txt -e backend
      - name: Record Open-Meteo's answers
        run: |
          # The same samples as the Mac job, so both ask Open-Meteo the same questions.
          (cd backend && RW_SAMPLE_WARNING_CLUBS=tutzinger-rv,seeclub-zuerich,ruderverein-albatros-klagenfurt,der-hamburger-und-germania-ruder-club RW_SAMPLE_FROST_CLUBS=ruderclub-forggensee RW_SAMPLE_LAKE_WIND=192,5.2,7.9 RW_SAMPLE_SATELLITE_WATER=simssee \
            RW_OPEN_METEO_TAPE="$RUNNER_TEMP/tape" RW_OPEN_METEO_TAPE_MODE=record \
            nohup uvicorn rowfrog.api:app --port 8000 > ../uvicorn.log 2>&1 &)
          curl -sS --retry 10 --retry-connrefused --retry-delay 2 -o /dev/null http://localhost:8000/lakes
          # The clubs the screens open or keep as home, and the confirmed clubs of the lists.
          clubs=$( (grep -oE -- '-RW(OpenClub|HomeClub) [a-z0-9-]+' .github/workflows/screenshots.yml | awk '{print $2}';
                    python3 -c 'import json; print("\n".join(c["id"] for c in json.load(open("data/locations.json"))["clubs"]))') | sort -u)
          lakes="aussenalster regattastrecke-oberschleissheim"
          for club in $clubs; do
            lake=$(curl -sS -f -m 200 --retry 2 --retry-all-errors --retry-delay 5 "http://localhost:8000/clubs/$club/forecast" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["lakeId"])') || { echo "::warning::$club not recorded"; continue; }
            lakes="$lakes $lake"
          done
          for lake in $(printf '%s\n' $lakes | sort -u); do
            curl -sS -f -m 200 --retry 2 --retry-all-errors --retry-delay 5 -o /dev/null "http://localhost:8000/lakes/$lake/view" \
              || echo "::warning::lake view $lake not recorded"
          done
          echo "$(ls "$RUNNER_TEMP/tape" | wc -l) answers recorded"
          grep -iE "warning|error" uvicorn.log | tail -20 || true
      - uses: actions/upload-artifact@v7
        with:
          name: open-meteo-tape
          path: ${{ runner.temp }}/tape
          retention-days: 1

  screenshots:
    needs: [newest-xcode, open-meteo-tape]
    # Also without a tape: the Mac then asks Open-Meteo live, as before.
    if: ${{ !cancelled() && needs.newest-xcode.result == 'success' }}
    runs-on: ${{ inputs.runner || needs.newest-xcode.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: open-meteo-tape
          path: ${{ runner.temp }}/tape
      - name: Get the earlier screenshots
        # The newest "screenshots" download of this branch, else main's, so a run with `only` keeps the other screens.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/screenshots
          for branch in "$GITHUB_REF_NAME" main; do
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow screenshots.yml --branch "$branch" --status success \
              --json databaseId --jq '.[].databaseId' -L 20 | while read -r id; do
                if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq '.artifacts[] | select(.name == "screenshots" and (.expired | not)) | .id' | grep -q .; then echo "$id"; break; fi
              done) || true  # no earlier run (or the lookup failed): start empty
            if [ -n "$run" ] && gh run download "$run" -R "$GITHUB_REPOSITORY" -n screenshots -D "$RUNNER_TEMP/earlier"; then
              [ -d "$RUNNER_TEMP/earlier/docs/screenshots" ] && cp -R "$RUNNER_TEMP/earlier/docs/screenshots/." docs/screenshots/
              echo "Started from run $run of $branch"; break
            fi
          done
      # Python from uv, exactly as on the Mac (update.sh); setup-python had no
      # Mac build of 3.12's security-only patches (scripts/check_pins_available.py).
      - name: Python from .python-version (uv)
        run: |
          curl -LsSf "https://astral.sh/uv/$(cat .uv-version)/install.sh" | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv -q --managed-python --python "$(cat .python-version)" "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          scripts/export_pins.sh   # backend/requirements-publish.txt from uv.lock (not in git)
      - run: uv pip install -q -c backend/requirements-publish.txt -e backend pillow
      - name: Start the backend with live data
        run: |
          # Open-Meteo's answers as recorded on Linux (job open-meteo-tape), where there are any.
          [ -n "$(ls "$RUNNER_TEMP/tape" 2>/dev/null)" ] && export RW_OPEN_METEO_TAPE="$RUNNER_TEMP/tape" && echo "Playing back $(ls "$RUNNER_TEMP/tape" | wc -l) Open-Meteo answers"
          (cd backend && RW_SAMPLE_WARNING_CLUBS=tutzinger-rv,seeclub-zuerich,ruderverein-albatros-klagenfurt,der-hamburger-und-germania-ruder-club RW_SAMPLE_FROST_CLUBS=ruderclub-forggensee RW_SAMPLE_LAKE_WIND=192,5.2,7.9 RW_SAMPLE_SATELLITE_WATER=simssee nohup uvicorn rowfrog.api:app --port 8000 > ../uvicorn.log 2>&1 &)
          curl -sS --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8000/lakes > /dev/null
          # When a warm-up call fails, show why: the backend's own warnings and
          # one direct call to Open-Meteo (a 429 there = the runner's address is
          # over Open-Meteo's limit, not a fault in the app).
          trap 'if [ $? -ne 0 ]; then
            echo "::group::Backend warnings"; grep -iE "warning|error|open-meteo" uvicorn.log | tail -40; echo "::endgroup::"
            curl -sS -m 30 -o /dev/null -w "Open-Meteo direct: HTTP %{http_code}\n" "https://api.open-meteo.com/v1/forecast?latitude=47.9&longitude=11.3&hourly=precipitation&forecast_hours=1" || true
          fi' EXIT
          # Warm the forecast and warning caches; Open-Meteo sometimes times out
          # on the first call and DWD's lake areas take a while to download.
          for club in mrc-1880 mrsv-bayern tutzinger-rv akademischer-ruderclub-wuerzburg seeclub-zuerich ruderverein-albatros-klagenfurt; do
            curl -sS -f -m 200 --retry 3 --retry-all-errors --retry-delay 5 "http://localhost:8000/clubs/$club/forecast" \
              | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          w = d["warnings"]
          print(d["clubId"], len(d["hours"]), "hours, now:", d["hours"][0]["light"], "| DWD:", w["status"], "lake area:", w["lakeArea"],
                "warnings:", [(i["kind"], i["event"], i["severity"], i["sample"]) for i in w["items"]])'
          done
          # Lakes of single shots: warmed too, or their lake view may still be loading.
          for lake in aussenalster regattastrecke-oberschleissheim; do
            curl -sS -f -m 200 --retry 3 --retry-all-errors --retry-delay 5 -o /dev/null "http://localhost:8000/lakes/$lake/view" || echo "Lake view $lake failed"
          done
          curl -sS -f -m 200 --retry 3 --retry-all-errors --retry-delay 5 http://localhost:8000/lakes/starnberger-see/view \
            | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          print(d["lakeId"], len(d["grid"]["cells"]), "cells,", len(d["points"]), "forecast points,", len(d["hours"]), "hours, zones:",
                list(zip(d["zones"], [z["light"] for z in d["hours"][0]["zones"]])))'
      - name: Build the app
        working-directory: ios
        env:
          DEVICE: ${{ github.event.inputs.device }}
          XCODE_INPUT: ${{ github.event.inputs.xcode }}
        run: |
          if [ -n "$XCODE_INPUT" ]; then
            XCODE=$(ls -d /Applications/Xcode_"$XCODE_INPUT"*.app | sort -V | tail -1)
            echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR="$XCODE/Contents/Developer"
            echo "Using $XCODE"
          fi
          brew install xcodegen
          xcodegen
          # Settings > About shows the real build number and commit (decision 0034).
          bash ../scripts/build_number.sh || echo "No build number stamped"
          # The newest iPhone Pro, or with device iPad the newest 11-inch iPad Pro (iPad Air as fallback);
          # "iPhone 13 mini" and "iPhone SE" pick that model (its name starts so, and none ends in Pro).
          UDID=$(xcrun simctl list devices available -j | DEVICE="$DEVICE" python3 -c '
          import json, os, sys
          family = os.environ["DEVICE"] or "iPhone"
          # Newest iOS last, so an Xcode 26 run shoots on iOS 26.
          runtimes = sorted((r for r in json.load(sys.stdin)["devices"].items() if "iOS" in r[0]),
                            key=lambda r: [int(n) for n in r[0].rsplit("iOS-", 1)[-1].split("-") if n.isdigit()])
          found = [d for runtime, devices in runtimes for d in devices if d["name"].startswith(family)]
          if family == "iPad":
              best = [d for d in found if d["name"].startswith("iPad Pro 11")] or [d for d in found if d["name"].startswith("iPad Air")]
          else:
              best = [d for d in found if d["name"].endswith(" Pro")]
          print((best or found)[-1]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          # iPad and small-iPhone shots live in their own folder of the same set, so the iPhone shots stay
          # (the iPhone 13 mini and SE, owner 14 Nov 2026: the smallest screens the app supports).
          case "$DEVICE" in
            iPad) echo "SHOTS=docs/screenshots/ipad" >> "$GITHUB_ENV" ;;
            "iPhone 13 mini") echo "SHOTS=docs/screenshots/iphone-13-mini" >> "$GITHUB_ENV" ;;
            "iPhone SE") echo "SHOTS=docs/screenshots/iphone-se" >> "$GITHUB_ENV" ;;
            *) echo "SHOTS=docs/screenshots" >> "$GITHUB_ENV" ;;
          esac
          xcrun simctl boot "$UDID"
          xcodebuild build \
            -project RowFrog.xcodeproj \
            -scheme RowFrog \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Take screenshots
        # The input comes in through the environment: an expression inside the
        # script would make GitHub check the whole script against its
        # 21,000-character limit for expressions.
        env:
          ONLY_INPUT: ${{ github.event.inputs.only }}
        run: |
          set -x
          xcrun simctl bootstatus "$UDID" -b
          # The iPad is turned through the Simulator app's menu keys, so open its window
          # now; a window still opening missed the first turn.
          # Newer Xcode releases moved the app, so it is looked up rather than named.
          if [ "$SHOTS" = docs/screenshots/ipad ]; then
            SIMAPP=$(find "$(xcode-select -p)/.." /Applications /Library/Developer -maxdepth 7 -name Simulator.app -print -quit 2>/dev/null || true)
            if [ -n "$SIMAPP" ]; then open -a "$SIMAPP" --args -CurrentDeviceUDID "$UDID" && sleep 20 || echo "::warning::Simulator app did not open; sideways iPad shots may stay upright"
            else open -b com.apple.iphonesimulator --args -CurrentDeviceUDID "$UDID" && sleep 20 || echo "::warning::Simulator app not found; sideways iPad shots may stay upright"; fi
          fi
          # The build takes longer than the backend keeps DWD warnings; warm it again
          # so the first shots do not catch a page still loading.
          for club in mrc-1880 mrsv-bayern tutzinger-rv; do
            curl -sS -m 200 --retry 3 --retry-all-errors --retry-delay 5 -o /dev/null "http://localhost:8000/clubs/$club/forecast" || true
          done
          curl -sS -m 200 --retry 3 --retry-all-errors --retry-delay 5 -o /dev/null http://localhost:8000/lakes/starnberger-see/view || true
          xcrun simctl install "$UDID" ios/build/Build/Products/Debug-iphonesimulator/RowFrog.app
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4
          mkdir -p "$SHOTS"
          ONLY="${ONLY_INPUT:-}"
          wanted() { [ -z "$ONLY" ] || [[ "$1" =~ $ONLY ]]; }
          shoot() {  # name, appearance, launch arguments...
            local name=$1 appearance=$2; shift 2
            wanted "$name" || return 0
            # With MRC 1880 as home base and the confirmed clubs, and without the
            # tour and the one-time tips, unless GUIDE is set for the shot.
            local guide=(-RWDemoClubs YES -RWTutorialSeen YES -RWNoTips YES)
            [ -n "${GUIDE:-}" ] && guide=()
            # The safety notice is accepted for every shot except its own (SAFETY set).
            local safety=(-RWSafetyAccepted YES)
            [ -n "${SAFETY:-}" ] && safety=()
            # "What's new" stays away except in its own shots (NEWS set).
            local news=(-RWWhatsNewSeen 1000)
            [ -n "${NEWS:-}" ] && news=()
            # The app follows the phone's clock by default now (4 Nov 2026) and the
            # Simulator is a US phone, so shots keep 24-hour times unless they set one.
            local clock=(-RWTimeFormat hours24)
            [[ " $* " == *" -RWTimeFormat "* ]] && clock=()
            xcrun simctl ui "$UDID" appearance "$appearance"
            # iPadOS ignores the app's own turn (-RWLandscape) for apps in windows, so the
            # iPad Simulator itself is turned with Rotate Right / Rotate Left (Cmd+arrow).
            if [ "$SHOTS" = docs/screenshots/ipad ]; then
              local turn=""
              if [[ " $* " == *" -RWLandscape YES "* && -z "${SIDEWAYS:-}" ]]; then turn=124; SIDEWAYS=1
              elif [[ " $* " != *" -RWLandscape YES "* && -n "${SIDEWAYS:-}" ]]; then turn=123; SIDEWAYS=""; fi
              if [ -n "$turn" ]; then
                osascript -e 'tell application "Simulator" to activate' -e 'delay 2' \
                  -e "tell application \"System Events\" to key code $turn using command down" || echo "Could not turn the Simulator"
                sleep 5
              fi
            fi
            # A hung simulator once blocked here until the 6-hour job limit; give up after a minute.
            perl -e 'alarm 60; exec @ARGV' xcrun simctl terminate "$UDID" com.rowfrog.RowFrog || true
            # The runner's clock is UTC; show times as a phone in Bavaria would.
            SIMCTL_CHILD_TZ=Europe/Berlin xcrun simctl launch "$UDID" com.rowfrog.RowFrog "${safety[@]}" "${news[@]}" "${guide[@]}" "${clock[@]}" "$@"
            # The first launch after install, and the backend's first answers, are slower.
            if [ -z "${WARM:-}" ]; then sleep 30; WARM=1; else sleep "${WAIT:-12}"; fi
            xcrun simctl io "$UDID" screenshot "$SHOTS/$name.png"
            # The simulator saves landscape shots sideways; turn them upright.
            # With landscape off the app stays upright, so the shot already is.
            # The iPad, turned with Rotate Right, lies the other way round.
            if [[ " $* " == *" -RWLandscape YES "* && " $* " != *" -RWAllowsLandscape NO "* ]]; then
              local angle=90
              [ "$SHOTS" = docs/screenshots/ipad ] && angle=-90
              # Only a shot that is still upright-shaped lies sideways: Xcode 27's simctl already saves
              # landscape shots the right way round, and turning those again laid them on their side.
              python3 -c 'import sys; from PIL import Image; p = sys.argv[1]; im = Image.open(p); im.width < im.height and im.rotate(int(sys.argv[2]), expand=True).save(p)' "$SHOTS/$name.png" "$angle"
            fi
          }
          # Compares two screenshots below the navigation bar, whose glass
          # effect differs from launch to launch.
          same() {
            python3 -c 'import sys; from PIL import Image, ImageChops
          a, b = (Image.open(p).convert("RGB") for p in sys.argv[1:3])
          box = (0, 500, a.width, a.height - 300)
          sys.exit(0 if ImageChops.difference(a.crop(box), b.crop(box)).getbbox() is None else 1)' "$1" "$2"
          }
          shoot_pages() {  # name, appearance, launch arguments...: one screenshot per screen until the bottom
            local name=$1 appearance=$2; shift 2
            wanted "$name" || return 0
            local page dir=$SHOTS
            for page in $(seq 1 26); do
              shoot "$name-p$page" "$appearance" "$@" -RWScrollPage $((page - 1))
              if [ "$page" -gt 1 ] && same "$dir/$name-p$page.png" "$dir/$name-p1.png"; then
                echo "Page $page did not scroll; shooting it again."
                shoot "$name-p$page" "$appearance" "$@" -RWScrollPage $((page - 1))
              fi
              if [ "$page" -gt 1 ] && same "$dir/$name-p$page.png" "$dir/$name-p$((page - 1)).png"; then
                rm "$dir/$name-p$page.png"
                break
              fi
            done
          }
          shoot_n() {  # name, pages, appearance, launch arguments...: a fixed number of screens, for
            # pages with frosted glass, where two screenshots of the same screen are not identical
            local name=$1 pages=$2 appearance=$3; shift 3
            wanted "$name" || return 0
            local page
            for page in $(seq 1 "$pages"); do
              shoot "$name-p$page" "$appearance" "$@" -RWScrollPage $((page - 1))
            done
          }
          for f in "$SHOTS"/*.png; do
            if [ -e "$f" ] && wanted "$(basename "$f" .png)"; then rm "$f"; fi
          done
          shoot_pages 01-home light
          shoot_pages 02-list light -RWShowList YES
          shoot 03-search light -RWSearch "Ammersee"
          shoot_pages 04-tutzing-warning light -RWOpenClub tutzinger-rv
          shoot_pages 05-wuerzburg-river light -RWOpenClub akademischer-ruderclub-wuerzburg
          shoot_pages 06-list-with-river-club light -RWShowList YES
          shoot_pages 07-home-dark dark
          # A first start's stand-in cards, while the forecast loads (decision 0046).
          shoot 474-first-start-loading light -RWStayLoading YES
          shoot 475-first-start-loading-german-dark dark -RWStayLoading YES -RWLanguage de
          shoot_pages 09-icons light -RWIconGallery YES
          shoot_pages 39-conditions-proposal light -RWConditionsPreview YES
          # The Current conditions card and the larger view behind each tile.
          shoot 60-conditions-card light -RWOpenClub mrc-1880 -RWScrollTo conditions
          for c in temperature feelsLike humidity wind waves waterTemperature precipitation visibility cloudCover pressure thunderstorm uvIndex ice daylight; do
            shoot_pages "61-condition-$c" light -RWOpenClub mrc-1880 -RWOpenCondition "$c"
          done
          shoot 62-condition-wind-limits light -RWOpenClub mrc-1880 -RWOpenCondition wind -RWLimitInfo YES
          shoot 63-condition-wind-german-dark dark -RWOpenClub mrc-1880 -RWOpenCondition wind -RWLimitInfo YES -RWLanguage de
          # Boats and rowing limits: small boats ticked with own limits, two boats of
          # the user's own, the lake map coloured for big boats (so it warns).
          BOATS=(-RWMyBoats '({id = b-anna; name = Anna; type = gig; class = "4x";}, {id = b-flash; name = Flash; type = training; class = "1x";})')
          OWN=(-RWBoatLimits '{small = {windAmber = 2; gustAmber = 16; gustRed = 18;}; b-anna = {waveAmber = 0.4;};}')
          shoot 64-settings-limits light -RWShowSettings YES -RWSettingsPage limits "${BOATS[@]}" "${OWN[@]}"
          shoot 65-own-limits light -RWOpenClub mrc-1880 "${BOATS[@]}" "${OWN[@]}"
          shoot 66-own-limits-wind light -RWOpenClub mrc-1880 -RWOpenCondition wind -RWLimitInfo YES "${BOATS[@]}" "${OWN[@]}"
          shoot 67-boat-limits light -RWShowSettings YES -RWSettingsPage boat:b-anna "${BOATS[@]}" "${OWN[@]}"
          # A boat on the app's limits: the switch on, the list hidden (4 Nov 2026).
          shoot 364-boat-app-limits light -RWShowSettings YES -RWSettingsPage boat:b-flash "${BOATS[@]}" "${OWN[@]}"
          # Adding a boat: a sheet with Cancel and Add.
          shoot 363-new-boat light -RWShowSettings YES -RWSettingsPage limits -RWNewBoat YES "${BOATS[@]}"
          # The lake tile and map follow the ticked boat, as the club page does.
          WAIT=30 shoot 68-lake-card-ticked-boat light -RWOpenClub mrc-1880 -RWScrollTo lakeview "${BOATS[@]}" -RWBoat big
          WAIT=30 shoot 69-lake-map-ticked-boat light -RWOpenClub mrc-1880 -RWScrollTo lakeview -RWOpenLakeView YES "${BOATS[@]}" -RWBoat big
          # The boat button shows an own boat's class ("4x" for Anna) in the accent colour.
          shoot 303-boat-button-own light -RWOpenClub mrc-1880 "${BOATS[@]}" -RWBoat b-anna
          shoot 304-boat-button-own-landscape-dark dark -RWOpenClub mrc-1880 "${BOATS[@]}" -RWBoat b-anna -RWLandscape YES
          # Anna is kept at the home base (MRC 1880): at Tutzing the page uses small boats.
          shoot 333-boat-kept-elsewhere light -RWOpenClub tutzinger-rv "${BOATS[@]}" -RWBoat b-anna
          # The one-time tip there: an own boat waits under "At other clubs".
          # The one-time tip at the place line under the club's name.
          shoot 386-tip-place-line light -RWOpenClub mrc-1880 -RWPlaceTip YES
          shoot 387-tip-place-line-german-dark dark -RWOpenClub mrc-1880 -RWPlaceTip YES -RWLanguage de
          shoot 360-tip-boats-elsewhere light -RWOpenClub tutzinger-rv "${BOATS[@]}" -RWBoat b-anna -RWBoatTip YES
          shoot 361-tip-boats-elsewhere-german-dark dark -RWOpenClub tutzinger-rv "${BOATS[@]}" -RWBoat b-anna -RWBoatTip YES -RWLanguage de
          # The launch point in the club header (owner's choice B, 4 Nov 2026): the lake and town
          # line opens it in a sheet; the settings switch; Arrange page with it locked; the old card.
          shoot 380-header-launch-point light -RWOpenClub mrc-1880
          # A place line too long for one line breaks where the dot sits (owner, 5 Nov 2026).
