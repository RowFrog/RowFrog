      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          retention-days: 90
          path: |
            docs/screenshots
            uvicorn.log
      - name: Save screenshots under refs/screenshots
        run: |
          # One commit with only the pictures, kept outside the branch history.
          export GIT_INDEX_FILE="$RUNNER_TEMP/screenshots.index"
          git --work-tree=docs/screenshots add -A -f .
          tree=$(git write-tree)
          commit=$(git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$tree" -m "Screenshots of $GITHUB_REF_NAME at ${GITHUB_SHA::7}")
          git push -f origin "$commit:refs/screenshots/$GITHUB_REF_NAME"
          # Sets of branches that are gone (merged and deleted) are removed.
          branches=$(git ls-remote --heads origin | sed 's|.*refs/heads/||')
          git ls-remote origin 'refs/screenshots/*' | sed 's|.*refs/screenshots/||' | while read -r name; do
            if ! printf '%s\n' "$branches" | grep -qxF "$name"; then git push -q origin ":refs/screenshots/$name" || true; fi
          done
