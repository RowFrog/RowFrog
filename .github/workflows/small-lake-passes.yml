name: Small lake Landsat passes

# One-off check (thread "Compare measured and satellite lake temperatures"):
# how often Landsat gives a usable water temperature for small lakes
# (scripts/small_lake_passes.py). Runs on push of the script on this branch only;
# remove before any merge. Landsat needs no account. Nothing is stored except
# the CSV kept as a run artifact for 30 days.

on:
  push:
    branches: [claude/project-thread-ivf0sd]
    paths:
      - scripts/small_lake_passes.py
      - .github/workflows/small-lake-passes.yml

permissions:
  contents: read

jobs:
  passes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -c backend/requirements-publish.txt -e "backend[satellite]"
      - run: python3 scripts/small_lake_passes.py 2026-01-01
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: small-lake-passes
          path: small-lake-passes.csv
          retention-days: 30
