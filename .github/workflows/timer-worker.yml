name: Forecast timer

# Deploys the Cloudflare Worker in cloudflare/timer/ that starts "Publish
# forecasts" every half hour, on time (GitHub's own timer runs late when
# GitHub is busy). Needs the secrets PUBLISH_TIMER_TOKEN (fine-grained,
# Actions read and write on this repository), CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID.
# Pushes to other branches and runs with "deploy" off only check the GitHub
# token; the Worker is deployed from main.

on:
  push:
    paths:
      - cloudflare/timer/**
      - .github/workflows/timer-worker.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the Worker (off = only check the GitHub token)
        type: boolean
        default: false

concurrency:
  group: timer-worker
  cancel-in-progress: false

jobs:
  token:
    runs-on: ubuntu-latest
    steps:
      - name: Check the GitHub token
        env:
          TOKEN: ${{ secrets.PUBLISH_TIMER_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Missing secret PUBLISH_TIMER_TOKEN (fine-grained token, Actions: Read and write on $REPO)"; exit 1; fi
          code=$(curl -sS -o /tmp/out -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/publish-backend.yml")
          echo "reading the workflow: HTTP $code"
          [ "$code" = 200 ] || { cat /tmp/out; echo "::error::The token cannot read this repository's workflows (needs Actions: Read and write)"; exit 1; }

  deploy:
    needs: token
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.20.0
    defaults:
      run:
        working-directory: cloudflare/timer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the Cloudflare secrets
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi
      - name: Deploy the Worker
        run: $WRANGLER deploy
      - name: Set the GitHub token
        env:
          TOKEN: ${{ secrets.PUBLISH_TIMER_TOKEN }}
        run: printf '%s' "$TOKEN" | $WRANGLER secret put GITHUB_TOKEN
