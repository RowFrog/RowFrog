name: Water temperature stations

# Lists the water temperature stations (GKD Bayern, PEGELONLINE, Swiss BAFU)
# and the nearest one on each club's water (scripts/water_station_survey.py).
# Runs when the script changes, or by hand from the Actions tab. Nothing is stored.

on:
  push:
    paths:
      - scripts/water_station_survey.py
      - .github/workflows/water-stations.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e backend
      - run: python3 scripts/water_station_survey.py
