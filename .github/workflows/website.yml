name: Website

# Builds and tests the website in web/ (forecasts in the browser at
# rowfrog.com/app, plus the start and legal pages) and, on main, deploys it to
# Cloudflare Pages (project rowfrog-web). While in testing the whole site is
# behind a password (web/functions/_middleware.js).
# Needs the secrets CLOUDFLARE_API_TOKEN (with "Cloudflare Pages: Edit"),
# CLOUDFLARE_ACCOUNT_ID, SITE_USER and SITE_PASSWORD (see docs/handbook.md).

on:
  pull_request:
    paths:
      - web/**
      - testdata/**
      - scripts/build_web.py
      - ios/RowFrog/Assets.xcassets/AppIcon.appiconset/light.png
      - ios/RowFrog/Localization.swift
      - ios/RowFrog/Charts/**
      - .github/workflows/website.yml
      - package-lock.json
      - .nvmrc
      - .python-version
  push:
    branches: [main]
    paths:
      - web/**
      - testdata/**
      - scripts/build_web.py
      - ios/RowFrog/Assets.xcassets/AppIcon.appiconset/light.png
      - ios/RowFrog/Localization.swift
      - ios/RowFrog/Charts/**
      - .github/workflows/website.yml
      - package-lock.json
      - .nvmrc
      - .python-version
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: the build number in the footer is the commit count (build_web.py).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: pip install -c backend/requirements-publish.txt pillow
      - name: Tests
        run: |
          set -o pipefail
          node --test --experimental-test-coverage --test-reporter=spec web/tests/*.test.mjs | tee node-test.log
      - name: Coverage in the run summary
        if: always()
        run: python3 scripts/coverage_summary.py node node-test.log "Website" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build (fails on a text without German)
        run: python scripts/build_web.py
      - name: Browser test (the built site in Chromium, with the sample API files)
        run: |
          # Playwright's exact version comes from package-lock.json (repository root).
          npm run setup && npx --no -- playwright install --with-deps chromium
          node --test web/tests/browser/*.test.mjs
      - name: Same versions as pinned (Node from .nvmrc, npm tools from package-lock.json)
        run: python3 scripts/check_versions.py --node --npm --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: web/dist
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_USER: ${{ secrets.SITE_USER }}
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      # Optional: satellite pictures on the website's maps (basemap.js); public in the browser, limited to the site in MapTiler.
      MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
      # wrangler's exact version comes from package-lock.json (repository root).
      WRANGLER: npx --no -- wrangler
      PROJECT: rowfrog-web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm run setup
        working-directory: .
      - uses: actions/download-artifact@v8
        with:
          name: website
          path: web/dist
      - name: Check the secrets
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SITE_USER SITE_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi
      - name: Create the Pages project if needed
        run: |
          if ! $WRANGLER pages project list | grep -q "\b$PROJECT\b"; then
            $WRANGLER pages project create "$PROJECT" --production-branch main
          fi
      - name: Set the password
        run: |
          printf '%s' "$SITE_USER" | $WRANGLER pages secret put SITE_USER --project-name "$PROJECT"
          printf '%s' "$SITE_PASSWORD" | $WRANGLER pages secret put SITE_PASSWORD --project-name "$PROJECT"
      - name: Map key for the satellite pictures
        run: |
          if [ -n "$MAPTILER_KEY" ]; then
            python3 -c 'import json, os; print(json.dumps({"maptilerKey": os.environ["MAPTILER_KEY"]}))' > dist/app/config.json
            echo "Satellite pictures on: config.json written"
          else
            echo "No MAPTILER_KEY secret: the maps show the street map only, without the globe button"
          fi
      - name: Deploy
        # Run from web/ so wrangler finds web/functions (the password check).
        run: $WRANGLER pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true
      - name: Check the site is locked
        run: |
          base="https://$PROJECT.pages.dev"
          sleep 20
          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/app/")
          echo "Without password: $code"
          [ "$code" = 401 ] || { echo "::error::The site answered $code without a password"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -u "$SITE_USER:$SITE_PASSWORD" "$base/app/")
          echo "With password: $code"
          [ "$code" = 200 ] || { echo "::error::The site answered $code with the password"; exit 1; }
          curl -sI "$base/app/" | grep -i '^x-robots-tag: noindex' || { echo "::error::noindex header missing"; exit 1; }
          # The login page: a wrong password gets no cookie, the right one a cookie that opens the site.
          code=$(curl -s -o /dev/null -w '%{http_code}' --data-urlencode "user=$SITE_USER" --data-urlencode "password=wrong-$RANDOM" "$base/__login")
          echo "Login with a wrong password: $code"
          [ "$code" = 401 ] || { echo "::error::A wrong login answered $code"; exit 1; }
          jar=$(mktemp)
          code=$(curl -s -o /dev/null -w '%{http_code}' -c "$jar" --data-urlencode "user=$SITE_USER" --data-urlencode "password=$SITE_PASSWORD" --data-urlencode "next=/app/" "$base/__login")
          echo "Login: $code"
          [ "$code" = 303 ] || { echo "::error::The login answered $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" "$base/app/")
          echo "With the login cookie: $code"
          rm -f "$jar"
          [ "$code" = 200 ] || { echo "::error::The site answered $code with the login cookie"; exit 1; }
          for site in https://rowfrog.com https://www.rowfrog.com; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$site/app/" || true)
            echo "$site without password: $code (401 once the domain is attached)"
          done
