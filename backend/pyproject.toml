[project]
name = "rowfrog"
version = "0.1.0"
description = "Backend for Row Frog: merges weather and lake data into a rowing forecast per launch point"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "Pillow>=10"]
# Reading the Copernicus satellite ice maps and DWD's ICON-D2 grids for the
# weather maps, and saving the Sentinel-2 pictures as JPEG; only the
# publishing job needs it.
satellite = ["rasterio>=1.3", "eccodes>=2.37", "Pillow>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rowfrog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
