[project]
name = "rowfrog"
version = "0.1.0"
description = "Backend for Row Frog: merges weather and lake data into a rowing forecast per launch point"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "Pillow>=10", "httpx2", "ruff", "pyyaml>=6.0.3"]
# Reading the Copernicus satellite ice maps and DWD's ICON-D2 grids for the
# weather maps, and saving the Sentinel-2 pictures as JPEG; only the
# publishing job needs it.
# numpy (already there for rasterio) also speeds up the nearby-water mixing of
# the club forecasts; without it lake_view falls back to plain Python.
# eccodeslib is the ecCodes library itself. eccodes asks for it only in its
# Linux/macOS wheel, not in the metadata uv reads, so it is named here.
satellite = ["rasterio>=1.3", "eccodes>=2.37", "eccodeslib", "Pillow>=10", "numpy>=2"]
# River sections from OpenStreetMap (river-sections.yml only).
rivers = ["shapely", "osmium"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rowfrog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Checked in CI (backend job) over backend/ and scripts/: names used before
# they are set, unused imports and syntax errors. Style is left alone.
[tool.ruff]
line-length = 140
# The jobs run Python 3.14 (.python-version). The target stays at 3.12 on purpose:
# the Pi runs backend/rowfrog/source_status.py and its issue job on Debian's
# Python 3.13, so no syntax newer than that may slip in.
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9"]

# One lock for every system (uv.lock): GitHub's Linux x86_64 runners, the Pi
# (Linux aarch64) and the Mac (macOS arm64). `uv lock` fails if a locked
# package has no installable build for one of them, so a bump that would
# break the Pi or the Mac never gets a lock.
[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
