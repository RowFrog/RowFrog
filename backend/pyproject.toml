[project]
name = "rowfrog"
version = "0.1.0"
description = "Backend for Row Frog: merges weather and lake data into a rowing forecast per launch point"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "Pillow>=10", "httpx2"]
# Reading the Copernicus satellite ice maps and DWD's ICON-D2 grids for the
# weather maps, and saving the Sentinel-2 pictures as JPEG; only the
# publishing job needs it.
satellite = ["rasterio>=1.3", "eccodes>=2.37", "Pillow>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rowfrog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Checked in CI (backend job) over backend/ and scripts/: names used before
# they are set, unused imports and syntax errors. Style is left alone.
[tool.ruff]
line-length = 140
# The jobs run Python 3.12 (scripts use 3.12 f-strings).
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9"]
