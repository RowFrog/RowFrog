# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
name: RowFrog
options:
  bundleIdPrefix: com.rowfrog
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RowFrog:
    type: application
    platform: iOS
    sources: [RowFrog]
    dependencies:
      - target: RowFrogWidget
    entitlements:
      path: RowFrog/RowFrog.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rowfrog.RowFrog]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rowfrog.RowFrog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Row Frog
        TARGETED_DEVICE_FAMILY: "1"
        # Icon 9 (coxed double) is the app icon; the others can be picked in the settings.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: >-
          AppIcon-SunriseSculler AppIcon-CloudCrossedOars AppIcon-AlpineLake
          AppIcon-BladeAndWind AppIcon-RowingLightGauge AppIcon-AvatarFrog
          AppIcon-BladeTrafficLight AppIcon-ShellTrafficLight AppIcon-CoxedPair AppIcon-FrogGauge
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
      configs:
        # Debug (Simulator) uses the backend running on the Mac; Release uses the published
        # forecasts on GitHub Pages. A server of our own later only changes this address.
        Debug:
          RW_API_BASE_URL: http://localhost:8000
        Release:
          RW_API_BASE_URL: https://api.rowfrog.com/v1
    info:
      path: RowFrog/Info.plist
      properties:
        # Backend address, set per build configuration above.
        RWAPIBaseURL: $(RW_API_BASE_URL)
        # The published files, in every build: only the publishing job makes the
        # satellite pictures, so the backend on the Mac has none.
        RWPublishedBaseURL: https://api.rowfrog.com/v1
        # Shown when the first-start tour asks for the location (German in de.lproj/InfoPlist.strings).
        NSLocationWhenInUseUsageDescription: Row Frog uses your location only to suggest rowing clubs near you.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # A tap on the widget opens rowfrog://club/<id>.
        CFBundleURLTypes:
          - CFBundleURLName: com.rowfrog.RowFrog
            CFBundleURLSchemes: [rowfrog]
        # Upright and on its side; the pages switch to two columns when wide enough.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  RowFrogWidget:
    type: app-extension
    platform: iOS
    sources:
      - RowFrogWidget
      # The app's models, settings and formatting, and the widget's views, which
      # the app also uses for its widget preview page.
      - path: RowFrog/Models.swift
      - path: RowFrog/APIClient.swift
      - path: RowFrog/Localization.swift
      - path: RowFrog/AppSettings.swift
      - path: RowFrog/Units.swift
      - path: RowFrog/Conditions.swift
      - path: RowFrog/Limits.swift
      - path: RowFrog/Sky.swift
      - path: RowFrog/TrafficLightView.swift
      - path: RowFrog/Backgrounds.swift
      - path: RowFrog/WidgetViews.swift
      - path: RowFrog/OwnPlaces.swift
    entitlements:
      path: RowFrogWidget/RowFrogWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rowfrog.RowFrog]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rowfrog.RowFrog.Widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Row Frog
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
      configs:
        # The same backend as the app.
        Debug:
          RW_API_BASE_URL: http://localhost:8000
        Release:
          RW_API_BASE_URL: https://api.rowfrog.com/v1
    info:
      path: RowFrogWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        RWAPIBaseURL: $(RW_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  RowFrogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RowFrogTests]
    dependencies:
      - target: RowFrog
schemes:
  RowFrog:
    build:
      targets:
        RowFrog: all
    test:
      targets: [RowFrogTests]
