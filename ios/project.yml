# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
name: RowerWeather
options:
  bundleIdPrefix: com.rowerweatherfrog
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RowerWeather:
    type: application
    platform: iOS
    sources: [RowerWeather]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rowerweatherfrog.RowerWeather
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: RowerWeather
        TARGETED_DEVICE_FAMILY: "1"
        # Icon 9 (coxed double) is the app icon; the others can be picked in the settings.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: >-
          AppIcon-SunriseSculler AppIcon-CloudCrossedOars AppIcon-AlpineLake
          AppIcon-BladeAndWind AppIcon-RowingLightGauge AppIcon-AvatarFrog
          AppIcon-BladeTrafficLight AppIcon-ShellTrafficLight AppIcon-CoxedPair AppIcon-FrogGauge
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
      configs:
        # Debug (Simulator) uses the backend running on the Mac; Release uses the published
        # forecasts on GitHub Pages. A server of our own later only changes this address.
        Debug:
          RW_API_BASE_URL: http://localhost:8000
        Release:
          RW_API_BASE_URL: https://rowerweatherfrog.github.io/RowerWeather/v1
    info:
      path: RowerWeather/Info.plist
      properties:
        # Backend address, set per build configuration above.
        RWAPIBaseURL: $(RW_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  RowerWeatherTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RowerWeatherTests]
    dependencies:
      - target: RowerWeather
schemes:
  RowerWeather:
    build:
      targets:
        RowerWeather: all
    test:
      targets: [RowerWeatherTests]
