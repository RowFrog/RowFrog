# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
name: RowFrog
options:
  bundleIdPrefix: com.rowfrog
  deploymentTarget:
    iOS: "18.0"
  # Tells Xcode which version last checked the project's settings, so the
  # "Update to recommended settings" warning stays away after the ones below.
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    # The version stays 0.1.0 until a real release. The build number (CURRENT_PROJECT_VERSION)
    # and the commit (RW_COMMIT) come from BuildNumber.xcconfig below, which
    # scripts/build_number.sh stamps (decision 0034).
    MARKETING_VERSION: "0.1.0"
    # Xcode's recommended settings (owner clicked through the list on 2026-11-02);
    # here, because a click in Xcode is lost on the next xcodegen.
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # The last one on Xcode's list (2026-11-04): Image.iconPreviewAlpineLake and so
    # on for the asset catalogue's pictures; none of their names clash with Apple's.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
# Build number and commit for every target (the app and the widget must share the build number).
configFiles:
  Debug: BuildNumber.xcconfig
  Release: BuildNumber.xcconfig
targets:
  RowFrog:
    type: application
    platform: iOS
    sources: [RowFrog]
    dependencies:
      - target: RowFrogWidget
    # Device builds from Xcode (⌘R on the iPhone or iPad) leave a line in log/device-builds.log:
    # when, build number, commit, configuration. Simulator builds and archives are left out.
    postBuildScripts:
      - name: Log device builds
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/../log/device-builds.log
        script: |
          if [ "$PLATFORM_NAME" = iphoneos ] && [ "$ACTION" = build ] && [ "${CODE_SIGNING_ALLOWED:-YES}" != NO ]; then
            echo "$(date '+%Y-%m-%d %H:%M %Z') build $CURRENT_PROJECT_VERSION commit $RW_COMMIT $CONFIGURATION ${TARGET_DEVICE_MODEL:-device}" >> "$SRCROOT/../log/device-builds.log" || true
          fi
    entitlements:
      path: RowFrog/RowFrog.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rowfrog.RowFrog]
        # Reads rowing workouts and their GPS routes for "Import a row"; never writes.
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rowfrog.RowFrog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Row Frog
        # iPhone and iPad; on the iPad the wide layouts (side list, two columns) take over.
        TARGETED_DEVICE_FAMILY: "1,2"
        # Icon 9 (coxed double) is the app icon; the others can be picked in the settings.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: >-
          AppIcon-SunriseSculler AppIcon-CloudCrossedOars AppIcon-AlpineLake
          AppIcon-BladeAndWind AppIcon-RowingLightGauge AppIcon-AvatarFrog
          AppIcon-BladeTrafficLight AppIcon-ShellTrafficLight AppIcon-CoxedPair AppIcon-FrogGauge
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
      configs:
        # Debug (Simulator) uses the backend running on the Mac; Release uses the published
        # forecasts on GitHub Pages. A server of our own later only changes this address.
        Debug:
          RW_API_BASE_URL: http://localhost:8000
        Release:
          RW_API_BASE_URL: https://api.rowfrog.com/v1
    info:
      path: RowFrog/Info.plist
      properties:
        # Backend address, set per build configuration above.
        RWAPIBaseURL: $(RW_API_BASE_URL)
        # The published files, in every build: only the publishing job makes the
        # satellite pictures, so the backend on the Mac has none.
        RWPublishedBaseURL: https://api.rowfrog.com/v1
        # The commit the app was built from (sha7, "dev" when not stamped), in Settings > About.
        RWCommit: $(RW_COMMIT)
        # Shown when the first-start tour asks for the location (German in de.lproj/InfoPlist.strings).
        NSLocationWhenInUseUsageDescription: Row Frog uses your location only to suggest rowing clubs near you.
        # Shown when "Import a row" first reads Apple Health (German in de.lproj/InfoPlist.strings).
        NSHealthShareUsageDescription: Row Frog reads your rowing workouts and their GPS routes, only on this iPhone, to turn rows you choose into routes.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # GPX, TCX and FIT files shared from other apps (CrewNerd, Garmin, Strava)
        # open in Row Frog and become a saved route.
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPS track
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.topografix.gpx, com.garmin.tcx, com.garmin.fit]
        LSSupportsOpeningDocumentsInPlace: false
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPX track
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
              public.mime-type: [application/gpx+xml]
          - UTTypeIdentifier: com.garmin.tcx
            UTTypeDescription: TCX activity
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [tcx]
              public.mime-type: [application/vnd.garmin.tcx+xml]
          - UTTypeIdentifier: com.garmin.fit
            UTTypeDescription: FIT activity
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fit]
              public.mime-type: [application/vnd.ant.fit]
        # Whether Google Maps' app is installed, for the map app setting.
        LSApplicationQueriesSchemes: [comgooglemaps]
        # A tap on the widget opens rowfrog://club/<id>.
        CFBundleURLTypes:
          - CFBundleURLName: com.rowfrog.RowFrog
            CFBundleURLSchemes: [rowfrog]
        # Upright and on its side; the pages switch to two columns when wide enough.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The iPad turns every way, as iPadOS expects of apps that run in windows.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  RowFrogWidget:
    type: app-extension
    platform: iOS
    sources:
      - RowFrogWidget
      # The app's models, settings and formatting, and the widget's views, which
      # the app also uses for its widget preview page.
      - path: RowFrog/Models.swift
      - path: RowFrog/DefaultsKey.swift
      - path: RowFrog/APIClient.swift
      - path: RowFrog/Localization.swift
      - path: RowFrog/AppSettings.swift
      - path: RowFrog/Units.swift
      - path: RowFrog/Conditions.swift
      - path: RowFrog/Limits.swift
      - path: RowFrog/Sky.swift
      - path: RowFrog/TrafficLightView.swift
      - path: RowFrog/DaylightRule.swift
      - path: RowFrog/Backgrounds.swift
      - path: RowFrog/WidgetViews.swift
      - path: RowFrog/WidgetLayouts.swift
      - path: RowFrog/WidgetDayBars.swift
      - path: RowFrog/NightFold.swift
      - path: RowFrog/OwnPlaces.swift
      - path: RowFrog/RiverModels.swift
    entitlements:
      path: RowFrogWidget/RowFrogWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rowfrog.RowFrog]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rowfrog.RowFrog.Widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Row Frog
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
      configs:
        # The same backend as the app.
        Debug:
          RW_API_BASE_URL: http://localhost:8000
        Release:
          RW_API_BASE_URL: https://api.rowfrog.com/v1
    info:
      path: RowFrogWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        RWAPIBaseURL: $(RW_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  RowFrogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RowFrogTests]
    settings:
      base:
        # Xcode 27 no longer signs a test bundle without an Info.plist.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: RowFrog
  # Starts the app in the Simulator and taps it, so a view that swallows taps
  # (as the frosted cards did in #220) fails the build.
  RowFrogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RowFrogUITests]
    settings:
      base:
        # Xcode 27 no longer signs a test bundle without an Info.plist.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: RowFrog
schemes:
  RowFrog:
    build:
      targets:
        RowFrog: all
    test:
      targets: [RowFrogTests, RowFrogUITests]
