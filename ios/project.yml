# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
name: RowerWeather
options:
  bundleIdPrefix: com.rowerweatherfrog
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RowerWeather:
    type: application
    platform: iOS
    sources: [RowerWeather]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rowerweatherfrog.RowerWeather
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: RowerWeather
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: RowerWeather/Info.plist
      properties:
        # Backend address; the simulator reaches a backend running on the Mac at localhost.
        RWAPIBaseURL: http://localhost:8000
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Upright and on its side; the pages switch to two columns when wide enough.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  RowerWeatherTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RowerWeatherTests]
    dependencies:
      - target: RowerWeather
schemes:
  RowerWeather:
    build:
      targets:
        RowerWeather: all
    test:
      targets: [RowerWeatherTests]
