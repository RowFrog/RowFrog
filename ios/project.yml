# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
name: RowerWeather
options:
  bundleIdPrefix: com.rowerweatherfrog
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RowerWeather:
    type: application
    platform: iOS
    sources: [RowerWeather]
    dependencies:
      - target: RowerWeatherWidget
    entitlements:
      path: RowerWeather/RowerWeather.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rowerweatherfrog.RowerWeather]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rowerweatherfrog.RowerWeather
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: RowerWeather
        TARGETED_DEVICE_FAMILY: "1"
        # Icon 9 (coxed double) is the app icon; the others can be picked in the settings.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: >-
          AppIcon-SunriseSculler AppIcon-CloudCrossedOars AppIcon-AlpineLake
          AppIcon-BladeAndWind AppIcon-RowingLightGauge AppIcon-AvatarFrog
          AppIcon-BladeTrafficLight AppIcon-ShellTrafficLight AppIcon-CoxedPair AppIcon-FrogGauge
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
      configs:
        # Debug (Simulator) uses the backend running on the Mac; Release uses the published
        # forecasts on GitHub Pages. A server of our own later only changes this address.
        Debug:
          RW_API_BASE_URL: http://localhost:8000
        Release:
          RW_API_BASE_URL: https://api.rowfrog.com/v1
    info:
      path: RowerWeather/Info.plist
      properties:
        # Backend address, set per build configuration above.
        RWAPIBaseURL: $(RW_API_BASE_URL)
        # Shown when the first-start tour asks for the location (German in de.lproj/InfoPlist.strings).
        NSLocationWhenInUseUsageDescription: RowerWeather uses your location only to suggest rowing clubs near you.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # A tap on the widget opens rowerweather://club/<id>.
        CFBundleURLTypes:
          - CFBundleURLName: com.rowerweatherfrog.RowerWeather
            CFBundleURLSchemes: [rowerweather]
        # Upright and on its side; the pages switch to two columns when wide enough.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  RowerWeatherWidget:
    type: app-extension
    platform: iOS
    sources:
      - RowerWeatherWidget
      # The app's models, settings and formatting, and the widget's views, which
      # the app also uses for its widget preview page.
      - path: RowerWeather/Models.swift
      - path: RowerWeather/APIClient.swift
      - path: RowerWeather/Localization.swift
      - path: RowerWeather/AppSettings.swift
      - path: RowerWeather/Units.swift
      - path: RowerWeather/Conditions.swift
      - path: RowerWeather/Sky.swift
      - path: RowerWeather/TrafficLightView.swift
      - path: RowerWeather/Backgrounds.swift
      - path: RowerWeather/WidgetViews.swift
    entitlements:
      path: RowerWeatherWidget/RowerWeatherWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rowerweatherfrog.RowerWeather]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rowerweatherfrog.RowerWeather.Widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RowerWeather
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
      configs:
        # The same backend as the app.
        Debug:
          RW_API_BASE_URL: http://localhost:8000
        Release:
          RW_API_BASE_URL: https://api.rowfrog.com/v1
    info:
      path: RowerWeatherWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        RWAPIBaseURL: $(RW_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  RowerWeatherTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RowerWeatherTests]
    dependencies:
      - target: RowerWeather
schemes:
  RowerWeather:
    build:
      targets:
        RowerWeather: all
    test:
      targets: [RowerWeatherTests]
